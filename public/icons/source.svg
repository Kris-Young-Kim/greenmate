<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2E1C"/>
      <stop offset="100%" stop-color="#2B9460"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="22%" r="54%">
      <stop offset="0%" stop-color="white" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Left leaf: ellipse rotated 45° (upper-left) -->
  <ellipse cx="197" cy="195" rx="84" ry="36"
           transform="rotate(45 197 195)" fill="white"/>

  <!-- Right leaf: ellipse rotated -45° (upper-right) -->
  <ellipse cx="315" cy="195" rx="84" ry="36"
           transform="rotate(-45 315 195)" fill="white"/>

  <!-- Stem (sits below the leaves) -->
  <line x1="256" y1="388" x2="256" y2="252"
        stroke="white" stroke-width="30" stroke-linecap="round"/>

  <!-- Tiny shoot at top center: gives a 3rd growing point feel -->
  <ellipse cx="256" cy="164" rx="16" ry="22"
           fill="white" fill-opacity="0.55"/>
</svg>
